services:
  max-forward-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 77.88.8.8
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    ports:
      - "8091:8091"
    volumes:
      - .:/app  # Это сохраняет config.json даже после удаления контейнера
